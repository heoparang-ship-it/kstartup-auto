name: Daily K-Startup Update + PDF Pipeline

# v11 (2026-05-18): PDF parsing timeout 회피
# 핵심 변경:
#   1. timeout 30 → 50분
#   2. update.py 직후 즉시 commit/push (recommendations.json 데이터 안전 보장)
#   3. PDF 단계는 continue-on-error → timeout/실패해도 데이터 push는 유지
#   4. PDF 결과는 두 번째 commit
# KST 1시 = UTC 16시 (전날), KST 18시 = UTC 9시
on:
  schedule:
    - cron: '0 16 * * *'   # 매일 KST 1시
    - cron: '0 9 * * *'    # 매일 KST 18시
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: '크롤 스킵 (recommendations.json 재사용)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_pdf:
        description: 'PDF 다운/파싱/큐 스킵 (recommendations 만 갱신)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache attachments
        id: cache-attach
        uses: actions/cache@v4
        with:
          path: attachments
          key: attachments-${{ hashFiles('recommendations.json') }}
          restore-keys: |
            attachments-

      - name: Cache parsed
        id: cache-parsed
        uses: actions/cache@v4
        with:
          path: parsed
          key: parsed-${{ hashFiles('recommendations.json') }}
          restore-keys: |
            parsed-

      - name: 1) Run update.py (recommendations 갱신)
        env:
          SKIP_CRAWL: ${{ github.event.inputs.skip_crawl }}
          BIZINFO_SERVICE_KEY: ${{ secrets.BIZINFO_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "$SKIP_CRAWL" = "true" ]; then ARGS="$ARGS --skip-crawl"; fi
          python update.py $ARGS

      - name: 1-B) Commit data first (안전 보장 — PDF 실패해도 데이터는 push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recommendations.json
          if git diff --cached --quiet; then
            echo "데이터 변경 없음 — skip"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d_%H시) recommendations 갱신"
            git push
          fi

      - name: 2) Download PDF attachments
        if: github.event.inputs.skip_pdf != 'true'
        continue-on-error: true
        env:
          PDF_SOURCES: bizinfo
        run: python 01_download_attachments.py

      - name: 3) Parse PDFs (opendataloader-pdf)
        if: github.event.inputs.skip_pdf != 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: python 02_parse_attachments.py

      - name: 4) Generate pending_pdf_score queue
        if: github.event.inputs.skip_pdf != 'true'
        continue-on-error: true
        run: python 03_gen_pending_pdf_score.py

      - name: 5) Commit PDF outputs (best-effort)
        if: always() && github.event.inputs.skip_pdf != 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # rebase to pick up any concurrent changes (e.g. data-only commit above)
          git pull --rebase origin main || true
          git add deep_analysis/ pending_pdf_score/ parsed/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "PDF 변경 없음 — skip"
          else
            NEW_PENDING=$(ls pending_pdf_score/*.json 2>/dev/null | grep -v _index | wc -l || echo 0)
            git commit -m "pdf: $(TZ=Asia/Seoul date +%Y-%m-%d_%H시) — pending ${NEW_PENDING}건"
            git push || true
          fi
